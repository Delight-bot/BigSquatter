[project]
name = "bigsquatter-coach"
version = "0.1.0"
description = "RAG coach for the Squat Challenge: Hugging Face retrieval + NVIDIA Nemotron via NIM"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "numpy>=2.0",
  "openai>=1.50",
  "sentence-transformers>=3.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]

[project.scripts]
coach = "coach.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
coach = ["knowledge/*.md"]
